server:
  port: 0

spring:
  application:
    name: job-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: testsecretkey1234567890123456789012
  expiration: 86400000

eureka:
  client:
    enabled: false

logging:
  level:
    com.hireconnect.jobservice: DEBUG
